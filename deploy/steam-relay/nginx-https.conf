limit_req_zone $binary_remote_addr zone=backlogame:1m rate=12r/m;
limit_conn_zone $binary_remote_addr zone=backlogame_connections:1m;
server {
    listen 443 ssl;
    server_name __SERVER_IP__;
    ssl_certificate /etc/letsencrypt/live/__SERVER_IP__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__SERVER_IP__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    client_max_body_size 1k;
    location = /v1/steam/library {
        limit_except GET { deny all; }
        limit_req zone=backlogame burst=5 nodelay;
        limit_req_status 429;
        limit_conn backlogame_connections 3;
        proxy_pass http://127.0.0.1:8787;
        proxy_connect_timeout 5s;
        proxy_read_timeout 45s;
    }
    location = /health {
        proxy_pass http://127.0.0.1:8787;
    }
    location / { return 404; }
}
